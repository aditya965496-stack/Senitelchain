version: '3.8'

services:
  sentinel-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-zero-trust-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_CHAIN_ID=80002
      - NEXT_PUBLIC_RPC_URL=https://polygon-amoy.drpc.org
      - NEXT_PUBLIC_CONTRACT_ADDRESS=${NEXT_PUBLIC_CONTRACT_ADDRESS:-}
      - PINATA_JWT=${PINATA_JWT:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
